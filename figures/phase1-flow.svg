  </g>

  <g text-anchor="middle">
    <text x="380" y="31" font-weight="600">MIMIC-IV-Note v2.2, radiology reports</text>
    <text x="380" y="49" fill="#333">2,321,355 reports</text>

    <text x="605" y="90" fill="#333">Excluded: 25,603 addenda</text>
    <text x="605" y="107" fill="#333">and 18,694 under 200 characters</text>

    <text x="380" y="151" font-weight="600">Sampling frame: 2,277,058 reports</text>
    <text x="380" y="169" fill="#333">237,199 patients, one report drawn per patient</text>

    <text x="190" y="241" font-weight="600">Stratum A: 350 reports</text>
    <text x="190" y="259" fill="#333">uniform random, 56 instances</text>
    <text x="570" y="241" font-weight="600">Stratum B: 150 reports</text>
    <text x="570" y="259" fill="#333">cue-enriched, 74 instances</text>

    <text x="105" y="331" font-weight="600">Development</text>
    <text x="105" y="348" fill="#333">positions 1 to 105</text>
    <text x="105" y="365" fill="#333">105 reports, 19 instances</text>
    <text x="285" y="331" font-weight="600">Test, scored once</text>
    <text x="285" y="348" fill="#333">positions 106 to 350</text>
    <text x="285" y="365" fill="#333">245 reports, 37 instances</text>
    <text x="485" y="331" font-weight="600">Development</text>
    <text x="485" y="348" fill="#333">positions 1 to 45</text>
    <text x="485" y="365" fill="#333">45 reports, 20 instances</text>
    <text x="665" y="331" font-weight="600">Test, scored once</text>
    <text x="665" y="348" fill="#333">positions 46 to 150</text>
    <text x="665" y="365" fill="#333">105 reports, 54 instances</text>

    <text x="380" y="442" font-weight="600">Held-out test split: 350 reports, 91 labelled instances</text>

    <text x="130" y="496" font-weight="600">Detection, per sentence</text>
    <text x="130" y="514" fill="#333">82 of 91 found</text>
    <text x="380" y="496" font-weight="600">Verification, whole report</text>
    <text x="380" y="514" fill="#333">61 of 91 kept</text>
    <text x="630" y="496" font-weight="600">Field filling and quote check</text>
    <text x="630" y="514" fill="#333">57 of 91 kept</text>

    <text x="380" y="577" fill="#333">Doubted candidates kept at a second tier instead of deleted:</text>
    <text x="380" y="595" fill="#333">82 of 91 reach the first or second tier</text>
  </g>
