    <line x1="380" y1="94" x2="467" y2="94" marker-end="url(#arrow)"/>
    <polyline points="380,180 380,196 190,196 190,217" marker-end="url(#arrow)"/>
    <polyline points="380,196 570,196 570,217" marker-end="url(#arrow)"/>
    <polyline points="190,270 190,290 105,290 105,307" marker-end="url(#arrow)"/>
    <polyline points="190,290 285,290 285,307" marker-end="url(#arrow)"/>
